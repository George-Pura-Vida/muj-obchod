name: DIANA API safety checks
on:
  pull_request:
    paths:
      - "api.php"
      - ".github/workflows/diana-api-tests.yml"
  push:
    branches:
      - feature/diana-activity-idempotency-20261122
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: php -l api.php
      - name: Ensure idempotency guard is present
        run: |
          grep -q 'CREATE TABLE IF NOT EXISTS activity_request_keys' api.php
          grep -q "duplicate.*true" api.php
